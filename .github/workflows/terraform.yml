name: Terraform

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  TF_VAR_enable_unity_catalog: ${{ vars.ENABLE_UNITY_CATALOG }}
  TF_VAR_databricks_account_id: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
  TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
  TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  TF_IN_AUTOMATION: "true"

jobs:
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
      backend_key: ${{ steps.vars.outputs.backend_key }}
      tf_environment: ${{ steps.vars.outputs.tf_environment }}
    steps:
      - name: Resolve target branch, environment and state file
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET="${{ github.base_ref }}"
          else
            TARGET="${{ github.ref_name }}"
          fi

          if [ "$TARGET" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "backend_key=terraform-azure.tfstate" >> "$GITHUB_OUTPUT"
            echo "tf_environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "backend_key=terraform-azure-dev.tfstate" >> "$GITHUB_OUTPUT"
            echo "tf_environment=dev" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: Validate & Plan
    needs: setup
    runs-on: ubuntu-latest
    env:
      TF_VAR_environment: ${{ needs.setup.outputs.tf_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ needs.setup.outputs.backend_key }}"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan (\`${{ needs.setup.outputs.environment }}\`) \`${{ steps.plan.outcome }}\`
            <details><summary>Show plan</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('#### Terraform Plan'));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    needs: [setup, plan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    # 'dev' auto-deploys on push to develop. 'production' requires manual
    # approval — configure required reviewers on the environment in
    # GitHub repo Settings > Environments.
    environment: ${{ needs.setup.outputs.environment }}
    env:
      TF_VAR_environment: ${{ needs.setup.outputs.tf_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - name: Terraform Init
        run: terraform init -input=false -backend-config="key=${{ needs.setup.outputs.backend_key }}"

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
